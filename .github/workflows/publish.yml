name: publish

on:
  workflow_dispatch:
    inputs:
      commit-hash:
        description: "Full YDB grammar commit SHA; default keeps the revision in Makefile"
        required: false
        type: string
        default: "default"

# Serialize version allocation and never interrupt a release halfway through.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout default branch and version tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ts/antlr4ng/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Select grammar revision
        env:
          GRAMMAR_COMMIT: ${{ inputs.commit-hash }}
        run: |
          if [[ "$GRAMMAR_COMMIT" != default ]]; then
            if [[ ! "$GRAMMAR_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo 'commit-hash must be a full 40-character commit SHA' >&2
              exit 1
            fi
            sed -i "s/^COMMIT_HASH ?=.*/COMMIT_HASH ?= $GRAMMAR_COMMIT/" Makefile
          fi

      - name: Select next patch version
        id: version
        run: |
          node --test scripts/*.test.mjs
          version=$(node scripts/next-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          npm --prefix ts/antlr4ng version "$version" --no-git-tag-version

      - name: Install package build dependencies
        run: npm ci --prefix ts/antlr4ng

      - name: Generate parsers and test Go output
        run: |
          make all
          make interface_checks
          go test ./tests/...

      - name: Prepare release commit and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add Makefile go ts js python dotnet java tests/parser_test.go
          git diff --cached --check
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"

      - name: Test the installable npm tarball
        run: npm test --prefix ts/antlr4ng

      - name: Describe the YDB grammar update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/release-notes.mjs

      - name: Build release assets
        run: |
          npm pack ./ts/antlr4ng --pack-destination release
          cd release
          shopt -s nullglob
          sha256sum ./*.tgz ./*.diff > SHA256SUMS

      - name: Push release commit and tag atomically
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release with npm package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release create "$RELEASE_TAG" release/*.tgz release/*.diff release/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --notes-file release/notes.md
